name: Release

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check for releasable commits
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.version }}
      last: ${{ steps.next.outputs.last }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Compute next version
        id: next
        run: |
          echo "version=$(uvx --from 'python-semantic-release>=10.7,<11' semantic-release --noop version --print 2>/dev/null)" >> "$GITHUB_OUTPUT"
          echo "last=$(uvx --from 'python-semantic-release>=10.7,<11' semantic-release --noop version --print-last-released 2>/dev/null)" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: check
    if: needs.check.outputs.next != needs.check.outputs.last
    uses: ./.github/workflows/test.yml

  release:
    name: Semantic release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # A newer commit may have landed on the branch since this run was queued;
      # release exactly the commit that was tested, not the branch tip.
      - name: Pin branch to the tested commit
        run: git reset --hard ${{ github.sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install release tooling
        run: uv pip install "python-semantic-release>=10.7,<11" build

      - name: Version, changelog, tag, build and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          semantic-release version
          semantic-release publish
          echo "tag=$(semantic-release version --print-last-released-tag)" >> "$GITHUB_OUTPUT"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/qisdebug/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qisdebug/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
