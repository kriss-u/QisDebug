[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qisdebug"
version = "0.1.1"
description = "Zero-touch instrumentation and timeline debugging for Qiskit circuits"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Krishna Upadhyay", email = "krishnaupadhyay1997@gmail.com" }]
maintainers = [{ name = "Krishna Upadhyay", email = "krishnaupadhyay1997@gmail.com" }]
keywords = ["qiskit", "quantum", "quantum-computing", "debugging", "instrumentation", "telemetry", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]
dependencies = [
    "qiskit>=1.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13",
    "textual>=0.60",
]

[project.optional-dependencies]
aer = ["qiskit-aer>=0.14"]
viz = ["matplotlib>=3.5"]
gui = ["pywebview>=5.0"]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "qiskit-aer>=0.14",
    "pylint==4.1.3",
    "astroid==4.3.4",
    "pylint-pydantic==0.4.1",
    "pyright==1.1.414",
    "pre-commit>=4",
    "build>=1.2",
    "twine>=6",
    "python-semantic-release>=10.7,<11",
    "pywebview>=5.0",
    "mcp>=1.0",
]
docs = ["sphinx>=7", "furo>=2024.1", "myst-parser>=2", "sphinx-autodoc-typehints>=1.25"]

[project.urls]
Homepage = "https://github.com/kriss-u/QisDebug"
Repository = "https://github.com/kriss-u/QisDebug"
Issues = "https://github.com/kriss-u/QisDebug/issues"
Changelog = "https://github.com/kriss-u/QisDebug/blob/main/CHANGELOG.md"

[project.scripts]
qisdebug = "qisdebug._cli.app:main"
qisdebug-mcp = "qisdebug._mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qisdebug" = ["py.typed"]
"qisdebug._frontends._web" = ["*.html", "*.css", "*.js"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "src/qisdebug/__init__.py:__version__",
    "CITATION.cff:version:nf",
]
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
# CITATION.cff's version is stamped via version_variables above; its release
# date has no built-in stamper, so the build step sets it and assets commits it.
build_command = "python .github/scripts/stamp_citation_date.py && python -m build"
assets = ["CITATION.cff"]
commit_message = "chore(release): {version} [skip ci]\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.beta]
match = "beta"
prerelease = true
prerelease_token = "beta"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pylint.MASTER]
load-plugins = ["pylint_pydantic"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "import-outside-toplevel",
    "broad-exception-caught",
    "unnecessary-comprehension",
]
