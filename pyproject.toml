[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qdebug"
version = "0.1.0"
description = "Zero-touch instrumentation and timeline debugging for Qiskit circuits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QDebug contributors" }]
keywords = ["qiskit", "quantum", "debugging", "instrumentation", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "qiskit>=1.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
aer = ["qiskit-aer>=0.14"]
viz = ["matplotlib>=3.5"]
gui = ["PySide6>=6.5"]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=7",
    "hypothesis>=6",
    "qiskit-aer>=0.14",
    "pylint>=3",
    "pylint-pydantic>=0.3",
    "PySide6>=6.5",
    "mcp>=1.0",
]
docs = ["sphinx>=7", "furo>=2024.1", "myst-parser>=2", "sphinx-autodoc-typehints>=1.25"]

[project.urls]
Homepage = "https://github.com/nullvector/qdebug"

[project.scripts]
qdebug-mcp = "qdebug._mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.MASTER]
load-plugins = ["pylint_pydantic"]
# PySide6's QtWidgets/QtCore/QtGui are shiboken6-generated C extensions with
# no introspectable Python source, so pylint can't see their members and
# reports every Qt class as a false-positive no-name-in-module otherwise.
extension-pkg-allow-list = ["PySide6.QtWidgets", "PySide6.QtCore", "PySide6.QtGui"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "import-outside-toplevel",
    "broad-exception-caught",
    "unnecessary-comprehension",
]
